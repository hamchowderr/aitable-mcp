<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AITable Node Explorer</title>
  <style>
    :root {
      --bg: #ffffff; --bg-secondary: #f8f9fa; --text: #1a1a2e;
      --text-secondary: #6c757d; --border: #dee2e6; --accent: #7c3aed;
      --accent-light: #ede9fe; --hover: #f1f3f5; --shadow: rgba(0,0,0,0.08);
    }
    .dark {
      --bg: #1a1a2e; --bg-secondary: #16213e; --text: #e8e8e8;
      --text-secondary: #a0a0b0; --border: #2d2d44; --accent: #a78bfa;
      --accent-light: #2d2050; --hover: #252540; --shadow: rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 16px; line-height: 1.5;
    }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .header h2 { font-size: 18px; font-weight: 600; }
    .breadcrumb {
      display: flex; align-items: center; gap: 6px; font-size: 13px;
      color: var(--text-secondary); margin-bottom: 12px; flex-wrap: wrap;
    }
    .breadcrumb .crumb {
      cursor: pointer; color: var(--accent); text-decoration: none;
    }
    .breadcrumb .crumb:hover { text-decoration: underline; }
    .breadcrumb .separator { color: var(--border); }
    .search-bar {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--bg-secondary); color: var(--text);
      font-size: 14px; outline: none; transition: border-color 0.2s; margin-bottom: 12px;
    }
    .search-bar:focus { border-color: var(--accent); }
    .search-bar::placeholder { color: var(--text-secondary); }
    .layout { display: flex; gap: 16px; }
    .tree-panel { flex: 1; min-width: 0; }
    .detail-panel {
      width: 260px; flex-shrink: 0; background: var(--bg-secondary);
      border: 1px solid var(--border); border-radius: 10px; padding: 16px;
      display: none;
    }
    .detail-panel.visible { display: block; }
    .detail-panel h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
    .detail-panel .detail-row {
      font-size: 13px; margin-bottom: 8px;
    }
    .detail-panel .detail-row .label {
      font-size: 11px; color: var(--text-secondary); text-transform: uppercase;
      letter-spacing: 0.3px; margin-bottom: 2px;
    }
    .detail-panel .detail-row .value {
      font-family: monospace; font-size: 12px; word-break: break-all;
    }
    .tree-list { display: flex; flex-direction: column; gap: 2px; }
    .tree-item {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      border-radius: 8px; cursor: pointer; transition: background 0.15s;
      font-size: 14px;
    }
    .tree-item:hover { background: var(--hover); }
    .tree-item.selected { background: var(--accent-light); }
    .tree-item .expand-btn {
      width: 20px; height: 20px; display: flex; align-items: center;
      justify-content: center; font-size: 10px; color: var(--text-secondary);
      transition: transform 0.2s; flex-shrink: 0;
    }
    .tree-item .expand-btn.expanded { transform: rotate(90deg); }
    .tree-item .expand-btn.hidden { visibility: hidden; }
    .tree-item .icon { font-size: 16px; flex-shrink: 0; }
    .tree-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-item .fav { color: #f59e0b; font-size: 12px; }
    .tree-item .type-badge {
      font-size: 10px; padding: 1px 6px; border-radius: 4px;
      background: var(--accent-light); color: var(--accent); font-weight: 500;
    }
    .tree-children { padding-left: 28px; }
    .tree-children.collapsed { display: none; }
    .loading-inline {
      padding: 8px 12px 8px 40px; font-size: 12px; color: var(--text-secondary);
    }
    .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
    .loading .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 30px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="header">
    <h2>Node Explorer</h2>
  </div>
  <div class="breadcrumb" id="breadcrumb">
    <span class="crumb" data-id="root">Space Root</span>
  </div>
  <input type="text" class="search-bar" id="search" placeholder="Search nodes..." />
  <div class="layout">
    <div class="tree-panel" id="tree-panel">
      <div class="loading"><div class="spinner"></div><div>Loading nodes...</div></div>
    </div>
    <div class="detail-panel" id="detail-panel">
      <h3 id="detail-title">Node Details</h3>
      <div id="detail-content"></div>
    </div>
  </div>
  <script type="module" src="./node-explorer.ts"></script>
</body>
</html>
