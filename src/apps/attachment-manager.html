<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AITable Attachment Manager</title>
  <style>
    :root {
      --bg: #ffffff; --bg-secondary: #f8f9fa; --text: #1a1a2e;
      --text-secondary: #6c757d; --border: #dee2e6; --accent: #7c3aed;
      --accent-light: #ede9fe; --hover: #f1f3f5; --shadow: rgba(0,0,0,0.08);
      --danger: #dc2626; --danger-light: #fef2f2;
      --success: #16a34a; --success-light: #dcfce7;
    }
    .dark {
      --bg: #1a1a2e; --bg-secondary: #16213e; --text: #e8e8e8;
      --text-secondary: #a0a0b0; --border: #2d2d44; --accent: #a78bfa;
      --accent-light: #2d2050; --hover: #252540; --shadow: rgba(0,0,0,0.3);
      --danger: #f87171; --danger-light: #450a0a;
      --success: #4ade80; --success-light: #14532d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 16px; line-height: 1.5;
    }
    h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
    .workflow-info {
      background: var(--accent-light); border: 1px solid var(--accent);
      border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;
      font-size: 13px; color: var(--accent);
    }
    .workflow-info strong { display: block; margin-bottom: 4px; }
    .workflow-steps { display: flex; gap: 20px; margin-top: 6px; }
    .workflow-steps .step {
      display: flex; align-items: center; gap: 6px;
    }
    .workflow-steps .step-num {
      width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
      color: white; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
    }
    .drop-zone {
      border: 2px dashed var(--border); border-radius: 12px; padding: 40px;
      text-align: center; cursor: pointer; transition: all 0.2s;
      background: var(--bg-secondary); margin-bottom: 16px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent); background: var(--accent-light);
    }
    .drop-zone .icon { font-size: 36px; margin-bottom: 8px; }
    .drop-zone .text { font-size: 14px; color: var(--text-secondary); }
    .drop-zone .hint { font-size: 12px; color: var(--text-secondary); margin-top: 4px; opacity: 0.7; }
    .file-list { display: flex; flex-direction: column; gap: 10px; }
    .file-card {
      display: flex; gap: 14px; padding: 14px;
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: 10px; align-items: flex-start;
    }
    .file-thumb {
      width: 48px; height: 48px; border-radius: 8px; background: var(--accent-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0; overflow: hidden;
    }
    .file-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .file-info { flex: 1; min-width: 0; }
    .file-info .name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-info .meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .token-box {
      margin-top: 8px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 10px; font-family: monospace;
      font-size: 11px; word-break: break-all; position: relative;
    }
    .token-box .copy-btn {
      position: absolute; top: 4px; right: 4px;
      padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px;
      font-size: 10px; cursor: pointer; background: var(--bg-secondary);
      color: var(--text-secondary); transition: all 0.15s;
    }
    .token-box .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .token-box .copy-btn.copied { background: var(--success-light); color: var(--success); border-color: var(--success); }
    .file-status {
      font-size: 11px; margin-top: 4px; font-weight: 500;
    }
    .file-status.uploading { color: var(--accent); }
    .file-status.done { color: var(--success); }
    .file-status.error { color: var(--danger); }
    .progress-bar {
      height: 4px; background: var(--border); border-radius: 2px;
      margin-top: 6px; overflow: hidden;
    }
    .progress-bar .fill {
      height: 100%; background: var(--accent); border-radius: 2px;
      transition: width 0.3s;
    }
    .stats { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
    .empty { text-align: center; padding: 20px; color: var(--text-secondary); font-size: 13px; }
  </style>
</head>
<body>
  <h2>Attachment Manager</h2>
  <div class="workflow-info">
    <strong>2-Step Upload Workflow</strong>
    <div class="workflow-steps">
      <div class="step"><span class="step-num">1</span> Upload file to get token</div>
      <div class="step"><span class="step-num">2</span> Use token in create/update records</div>
    </div>
  </div>
  <div class="drop-zone" id="drop-zone">
    <div class="icon">+</div>
    <div class="text">Click or drag files here to upload</div>
    <div class="hint">Files will be uploaded to the specified datasheet</div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="file-list" id="file-list"></div>
  <input type="file" id="file-input" multiple style="display: none;" />
  <script type="module" src="./attachment-manager.ts"></script>
</body>
</html>
