<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AITable Space Overview</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-secondary: #f8f9fa;
      --text: #1a1a2e;
      --text-secondary: #6c757d;
      --border: #dee2e6;
      --accent: #7c3aed;
      --accent-light: #ede9fe;
      --hover: #f1f3f5;
      --shadow: rgba(0,0,0,0.08);
    }
    .dark {
      --bg: #1a1a2e;
      --bg-secondary: #16213e;
      --text: #e8e8e8;
      --text-secondary: #a0a0b0;
      --border: #2d2d44;
      --accent: #a78bfa;
      --accent-light: #2d2050;
      --hover: #252540;
      --shadow: rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.5;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .header h2 { font-size: 18px; font-weight: 600; }
    .stats-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .stat-card {
      flex: 1;
      min-width: 120px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .stat-card .number {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
    }
    .stat-card .label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    .search-bar {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-secondary);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 12px;
    }
    .search-bar:focus { border-color: var(--accent); }
    .search-bar::placeholder { color: var(--text-secondary); }
    .node-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .node-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      transition: transform 0.15s, box-shadow 0.15s;
      cursor: default;
    }
    .node-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--shadow);
    }
    .node-card .icon {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .node-card .name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .node-card .type-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      background: var(--accent-light);
      color: var(--accent);
    }
    .node-card .meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 6px;
    }
    .node-card.fav .name::after {
      content: " \u2605";
      color: #f59e0b;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }
    .loading .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="header">
    <h2 id="title">Space Overview</h2>
  </div>
  <div class="stats-bar" id="stats-bar" style="display: none;"></div>
  <input type="text" class="search-bar" id="search" placeholder="Search nodes..." />
  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <div>Loading space data...</div>
    </div>
  </div>
  <script type="module" src="./space-overview.ts"></script>
</body>
</html>
