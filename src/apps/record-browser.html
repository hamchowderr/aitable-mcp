<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AITable Record Browser</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-secondary: #f8f9fa;
      --text: #1a1a2e;
      --text-secondary: #6c757d;
      --border: #dee2e6;
      --accent: #7c3aed;
      --accent-light: #ede9fe;
      --hover: #f1f3f5;
      --shadow: rgba(0,0,0,0.08);
    }
    .dark {
      --bg: #1a1a2e;
      --bg-secondary: #16213e;
      --text: #e8e8e8;
      --text-secondary: #a0a0b0;
      --border: #2d2d44;
      --accent: #a78bfa;
      --accent-light: #2d2050;
      --hover: #252540;
      --shadow: rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.5;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .header h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }
    .stats {
      font-size: 13px;
      color: var(--text-secondary);
      background: var(--bg-secondary);
      padding: 4px 12px;
      border-radius: 12px;
    }
    .search-bar {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-secondary);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 12px;
    }
    .search-bar:focus { border-color: var(--accent); }
    .search-bar::placeholder { color: var(--text-secondary); }
    .table-container {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 1px 3px var(--shadow);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead {
      background: var(--bg-secondary);
      position: sticky;
      top: 0;
      z-index: 1;
    }
    th {
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      border-bottom: 2px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover { color: var(--accent); }
    th .sort-indicator { margin-left: 4px; opacity: 0.5; }
    th.sorted .sort-indicator { opacity: 1; color: var(--accent); }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    tr:hover td { background: var(--hover); }
    tr:last-child td { border-bottom: none; }
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }
    .loading .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      background: var(--accent-light);
      color: var(--accent);
    }
    .cell-array {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="header">
    <h2 id="title">AITable Records</h2>
    <span class="stats" id="stats">Loading...</span>
  </div>
  <input type="text" class="search-bar" id="search" placeholder="Search records..." />
  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <div>Loading records...</div>
    </div>
  </div>
  <div class="pagination" id="pagination" style="display: none;"></div>
  <script type="module" src="./record-browser.ts"></script>
</body>
</html>
