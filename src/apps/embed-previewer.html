<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AITable Embed Link Previewer</title>
  <style>
    :root {
      --bg: #ffffff; --bg-secondary: #f8f9fa; --text: #1a1a2e;
      --text-secondary: #6c757d; --border: #dee2e6; --accent: #7c3aed;
      --accent-light: #ede9fe; --hover: #f1f3f5; --shadow: rgba(0,0,0,0.08);
      --danger: #dc2626; --danger-light: #fef2f2;
      --success: #16a34a; --success-light: #dcfce7;
    }
    .dark {
      --bg: #1a1a2e; --bg-secondary: #16213e; --text: #e8e8e8;
      --text-secondary: #a0a0b0; --border: #2d2d44; --accent: #a78bfa;
      --accent-light: #2d2050; --hover: #252540; --shadow: rgba(0,0,0,0.3);
      --danger: #f87171; --danger-light: #450a0a;
      --success: #4ade80; --success-light: #14532d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 16px; line-height: 1.5;
    }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .header h2 { font-size: 18px; font-weight: 600; }
    .stats { font-size: 13px; color: var(--text-secondary); background: var(--bg-secondary); padding: 4px 12px; border-radius: 12px; }
    .embed-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .embed-card {
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px; transition: box-shadow 0.15s;
    }
    .embed-card:hover { box-shadow: 0 2px 8px var(--shadow); }
    .embed-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .embed-header .link-id { font-size: 13px; font-weight: 600; color: var(--accent); }
    .embed-header .actions { display: flex; gap: 6px; }
    .embed-url {
      font-size: 12px; color: var(--text-secondary); word-break: break-all;
      background: var(--bg); padding: 8px 12px; border-radius: 6px;
      border: 1px solid var(--border); margin-bottom: 8px;
      font-family: monospace;
    }
    .embed-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .meta-badge {
      padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500;
      background: var(--accent-light); color: var(--accent);
    }
    .preview-frame {
      width: 100%; height: 300px; border: 1px solid var(--border);
      border-radius: 8px; margin-top: 8px; display: none;
    }
    .preview-frame.visible { display: block; }
    .btn-sm {
      padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 12px; font-weight: 500; cursor: pointer;
      background: var(--bg); color: var(--text); transition: all 0.15s;
    }
    .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm.danger:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-light); }
    .btn-sm.confirm { background: var(--danger); color: white; border-color: var(--danger); }
    .btn-sm.copied { background: var(--success-light); color: var(--success); border-color: var(--success); }
    .create-section {
      border-top: 2px solid var(--border); padding-top: 16px; margin-top: 8px;
    }
    .create-section h3 {
      font-size: 14px; font-weight: 600; color: var(--text-secondary);
      margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .create-row { display: flex; gap: 10px; align-items: end; }
    .create-row .form-group { flex: 1; }
    .create-row .form-group label {
      display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary);
    }
    select {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--bg-secondary); color: var(--text);
      font-size: 14px; font-family: inherit; outline: none;
    }
    .btn {
      padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .feedback { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; }
    .feedback.success { display: block; background: var(--success-light); color: var(--success); }
    .feedback.error { display: block; background: var(--danger-light); color: var(--danger); }
    .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
    .loading .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 30px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="header">
    <h2 id="title">Embed Links</h2>
    <span class="stats" id="stats">Loading...</span>
  </div>
  <div id="content">
    <div class="loading"><div class="spinner"></div><div>Loading embed links...</div></div>
  </div>
  <div id="feedback" class="feedback"></div>
  <script type="module" src="./embed-previewer.ts"></script>
</body>
</html>
